<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jordan & Raquel – Confirmação de presença</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2d2622;--mu:#7a6e66;--ac:#a8645a;--ac2:#f3e4df;--bd:#e8dcd3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1816;--card:#262120;--tx:#f2eae4;--mu:#b3a59b;--ac:#d98d80;--ac2:#3a2c29;--bd:#3d3532;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-size:2.6rem;text-align:center;margin:24px 0 4px}
.sub{text-align:center;color:var(--mu);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:18px}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.5rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mu);margin:12px 0 4px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
.opt{border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:var(--bg);font-weight:500}
.opt.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 1rem Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
.msg{margin-top:12px;padding:12px;border-radius:10px;background:var(--ac2)}
.pix{word-break:break-all;background:var(--bg);border:1px dashed var(--ac);border-radius:10px;padding:12px;font-family:ui-monospace,monospace;margin:8px 0}
.small{color:var(--mu);font-size:.85rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Jordan & Raquel</h1>
  <p class="sub">Vamos nos casar! Confirme sua presença abaixo 💍</p>

  <section class="card">
    <h2>Confirmar presença</h2>
    <label for="nome">Seu nome completo</label>
    <input id="nome" autocomplete="name" placeholder="Ex.: Maria Silva">
    <label>Você vai?</label>
    <div class="row">
      <div class="opt on" id="o-sim">Sim, estarei lá</div>
      <div class="opt" id="o-nao">Não poderei ir</div>
    </div>
    <div id="acompBox">
      <label for="acomp">Acompanhantes (além de você)</label>
      <select id="acomp"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
    </div>
    <label for="recado">Recado para os noivos (opcional)</label>
    <textarea id="recado" rows="3"></textarea>
    <button id="enviar">Enviar confirmação</button>
    <div class="msg" id="status" hidden></div>
  </section>

  <section class="card">
    <h2>Presente em dinheiro 🎁</h2>
    <p class="small" style="margin-top:0">Se quiser nos presentear, é só fazer um Pix para a chave abaixo. Obrigado pelo carinho!</p>
    <div class="pix" id="pixKey">raquelslandia@gmail.com</div>
    <p class="small" style="margin:0">Chave Pix do tipo e-mail</p>
    <button id="copiar">Copiar chave Pix</button>
    <div class="msg" id="copiado" hidden>Chave copiada!</div>
  </section>
</main>

<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz306BruN_Yga9oQQDdyV6pi8XkEk3_Tz7DEoOzh9b3906CRumvp0BlcZL3wR4uHttJ/exec";

var presenca = "sim";
var $ = function(id){ return document.getElementById(id); };
function say(t){ var s=$("status"); s.textContent=t; s.hidden=false; }

["o-sim","o-nao"].forEach(function(id){
  $(id).addEventListener("click", function(){
    presenca = id === "o-sim" ? "sim" : "nao";
    $("o-sim").classList.toggle("on", presenca === "sim");
    $("o-nao").classList.toggle("on", presenca === "nao");
    $("acompBox").hidden = presenca === "nao";
  });
});

$("copiar").addEventListener("click", function(){
  var k = $("pixKey").textContent;
  function ok(){ $("copiado").hidden=false; setTimeout(function(){ $("copiado").hidden=true; }, 2500); }
  function sel(){ var r=document.createRange(); r.selectNodeContents($("pixKey")); var s=getSelection(); s.removeAllRanges(); s.addRange(r); say("Selecione e copie a chave acima."); }
  try { navigator.clipboard.writeText(k).then(ok, sel); } catch(e){ sel(); }
});

$("enviar").addEventListener("click", function(){
  var nome = $("nome").value.trim();
  if(!nome){ say("Por favor, informe seu nome."); return; }
  if(SCRIPT_URL.indexOf("http") !== 0){ say("Página ainda não configurada. Avise os noivos."); return; }
  var btn = this; btn.disabled = true;
  var dados = {
    nome: nome,
    presenca: presenca === "sim" ? "Sim" : "Não",
    acompanhantes: presenca === "sim" ? parseInt($("acomp").value, 10) : 0,
    recado: $("recado").value.trim()
  };
  fetch(SCRIPT_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(dados) })
    .then(function(){
      say(presenca === "sim" ? "Presença confirmada! Obrigado, " + nome + " 💛 Esperamos você lá!" : "Recebemos sua resposta. Sentiremos sua falta, " + nome + "!");
      $("nome").value = ""; $("recado").value = "";
    })
    .catch(function(){ say("Não foi possível enviar agora. Tente de novo ou avise os noivos."); })
    .then(function(){ btn.disabled = false; });
});
</script>
</body>
</html>
